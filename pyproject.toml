[tool.poetry]
name = "aiogram-template"
version = "0.0.3"
description = "A modern aiogram 3 bot template: pydantic-settings, loguru, Redis/APScheduler, FTL i18n, poetry, ruff, pre-commit, commitizen and git-cliff."
authors = ["k0te1ch <khvostov40@gmail.com>"]
readme = "README.md"
license = "LICENSE"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
aiogram = "~=3.23.0"
pydantic = "^2.9"
pydantic-settings = "^2.5"
python-dotenv = "^1.0"
loguru = "^0.7"
redis = "^5.0"
apscheduler = "^3.10"
sqlalchemy = "^2.0"
alembic = "^1.13"
click = "^8.1"
pytz = "^2024.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.15"
pre-commit = "^4.0"
commitizen = "^4.4"

[tool.poetry.group.testing.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
aiogram-tests = { git = "https://github.com/k0te1ch/aiogram_tests" }
tgtest = { git = "https://github.com/k0te1ch/tgtest" }

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 119
exclude = ["logs", ".venv", "build", "dist", "migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N802",   # function name should be lowercase (aiogram callbacks/filters)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "N801",   # class name should use CapWords (language classes: ru, en)
    "N815",   # mixedCase variable in class scope (aiogram state names)
    "B008",   # do not perform function calls in argument defaults (aiogram filters)
    "RUF001", # ambiguous unicode (Cyrillic in localized strings)
    "RUF002", # ambiguous unicode docstring
    "RUF003", # ambiguous unicode comment
    "E402",   # module level import not at top (intentional in main.py)
    "SIM105", # contextlib.suppress suggestion
    "SIM108", # ternary operator suggestion
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "main", "config", "handlers", "filters", "forms",
    "utils", "keyboards", "middlewares", "services", "models",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end tests against a live bot via tgtest (require TG_* creds, run with -m e2e)",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "poetry"
tag_format = "v$version"
major_version_zero = true
# Changelog is generated by git-cliff in CI (.github/workflows/release.yml)
# on tag push — keep this disabled to avoid double-writes.
update_changelog_on_bump = false
bump_message = "bump: version $current_version -> $new_version"
